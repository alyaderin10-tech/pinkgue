<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff3f8">
<title>Pinkgue ♡</title>
<style>
:root{--pink:#e989b3;--dark:#b94f83;--pale:#fff1f7;--ink:#493743;--muted:#987f8e;--line:#f2dce7}
*{box-sizing:border-box}body{margin:0;background:#fffafd;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;gap:22px}
.logo{font-size:30px;font-weight:900;letter-spacing:-1.5px;color:var(--dark);white-space:nowrap}.logo span{color:#efa8c7}
.search{flex:1;max-width:620px}.search input{width:100%;border:0;outline:0;border-radius:24px;background:var(--pale);padding:14px 18px;font-size:14px}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f7c4dc,#d9c9f5);display:grid;place-items:center;color:white;font-weight:bold}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 10px 5px}
.navbtn,.cat{border:0;border-radius:22px;padding:10px 16px;cursor:pointer;font-weight:600}
.navbtn{background:transparent;color:var(--muted)}.navbtn.active,.navbtn:hover{background:#ffe7f1;color:var(--dark)}
main{max-width:1180px;margin:auto;padding:20px 24px 60px}
.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:12px 0 20px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#d17da3;font-weight:bold}
h1{font-size:clamp(25px,4vw,36px);margin:7px 0;letter-spacing:-1px}
.intro p{margin:0;color:var(--muted);font-size:14px}.tagline{background:var(--pale);color:var(--dark);padding:10px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.categories{display:flex;gap:8px;overflow-x:auto;padding:3px 0 20px;scrollbar-width:none}
.cat{background:white;border:1px solid var(--line);color:#8d7583;white-space:nowrap}.cat.active{background:#f7d1e2;color:#8d3c66;border-color:#f7d1e2}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{overflow:hidden;border:1px solid #f4e5ed;border-radius:16px;background:white;box-shadow:0 5px 18px #9d66800b}
.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f8eaf1}
.cardbody{padding:10px 11px 12px}.caption{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 9px}
.actions{display:flex;gap:6px;align-items:center}.action{border:0;background:#fff2f7;color:#a66d88;border-radius:18px;padding:7px 9px;cursor:pointer;font-size:12px}.action.liked{background:#ffe0eb;color:#d43f7b}.action.saved{background:#eee7ff;color:#8062b3}
.empty{grid-column:1/-1;text-align:center;padding:55px 10px;color:var(--muted)}
footer{text-align:center;color:#b69aa9;font-size:11px;padding:30px 10px}
.overlay{position:fixed;inset:0;background:#38233377;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}
.modal{width:min(430px,100%);background:white;border-radius:20px;padding:22px}.modal textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.modal button{border:0;border-radius:20px;padding:10px 15px;background:var(--dark);color:white;margin:8px 5px 0 0;cursor:pointer}.commentlist{max-height:150px;overflow:auto;font-size:13px;color:#7c6472}.commentlist p{padding:7px 0;border-bottom:1px solid var(--line)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){header{padding:12px;gap:10px}.logo{font-size:25px}.search input{padding:11px}.avatar{display:none}main{padding:14px 12px 45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.intro{align-items:start;flex-direction:column}.tagline{display:none}}
</style>
</head>
<body>
<header>
 <div class="logo">pink<span>gue</span>.</div>
 <div class="search"><input id="search" type="search" placeholder="Aklındaki estetiği keşfet..." aria-label="Fotoğraf ara"></div>
 <div class="avatar">P</div>
</header>
<nav>
 <button class="navbtn active" data-view="home">⌂ Ana sayfa</button>
 <button class="navbtn" data-view="explore">✧ Keşfet</button>
 <button class="navbtn" data-view="saved">▣ Kaydedilenler</button>
 <button class="navbtn" data-view="profile">♡ Profilim</button>
</nav>
<main>
 <section class="intro">
  <div><div class="eyebrow">YOUR LITTLE INSPIRATION SPACE</div><h1 id="heading">Bugün ne keşfediyoruz? ♡</h1><p id="subtitle">Sevdiğin renkler, küçük detaylar ve güzel fikirler burada.</p></div>
  <div class="tagline">✿ find your aesthetic</div>
 </section>
 <div class="categories" id="categories">
  <button class="cat active" data-cat="Tümü">Hepsi</button>
  <button class="cat" data-cat="Coquette">Coquette 🎀</button>
  <button class="cat" data-cat="Cute">Cute things 🧸</button>
  <button class="cat" data-cat="Fashion">Makeup & Fashion 💄</button>
  <button class="cat" data-cat="Nature">Nature 🌷</button>
  <button class="cat" data-cat="Soft girl">Soft girl 🩰</button>
  <button class="cat" data-cat="Room">Room decor 🪞</button>
 </div>
 <section class="grid" id="grid"></section>
 <footer>pinkgue ♡ küçük ilhamlar, güzel fikirler.<br>Fotoğraflar örnek görsellerdir. Beğeni ve kaydetmeler bu tarayıcıda demo olarak çalışır.</footer>
</main>
<div class="overlay" id="overlay"><div class="modal">
 <h3>Yorumlar ♡</h3><div class="commentlist" id="commentlist"></div>
 <textarea id="commentInput" placeholder="Tatlı bir yorum yaz..."></textarea><br>
 <button id="sendComment">Yorumu ekle</button><button id="closeModal" style="background:#f5e8ef;color:#8f6079">Kapat</button>
</div></div>
<script>
const photos=[
{cat:"Coquette",title:"Pembe çiçekler",id:1,url:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=700&auto=format&fit=crop&q=85"},
{cat:"Coquette",title:"Romantik kurdele detayları",id:2,url:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=700&auto=format&fit=crop&q=85"},
{cat:"Coquette",title:"Pastel pembe dokunuşlar",id:3,url:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=700&auto=format&fit=crop&q=85"},
{cat:"Coquette",title:"Zarif aksesuarlar",id:4,url:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?w=700&auto=format&fit=crop&q=85"},
{cat:"Cute",title:"Sevimli küçük detaylar",id:5,url:"https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=700&auto=format&fit=crop&q=85"},
{cat:"Cute",title:"Tatlı masa düzeni",id:6,url:"https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=700&auto=format&fit=crop&q=85"},
{cat:"Cute",title:"Renkli minik objeler",id:7,url:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=700&auto=format&fit=crop&q=85"},
{cat:"Cute",title:"Yumuşak pastel tonlar",id:8,url:"https://images.unsplash.com/photo-1490312278390-ab64016e0aa9?w=700&auto=format&fit=crop&q=85"},
{cat:"Fashion",title:"Günlük stil ilhamı",id:9,url:"https://images.unsplash.com/photo-1483985988355-763728e1935b?w=700&auto=format&fit=crop&q=85"},
{cat:"Fashion",title:"Moda moodboard",id:10,url:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=700&auto=format&fit=crop&q=85"},
{cat:"Fashion",title:"Makyaj ve güzellik",id:11,url:"https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=700&auto=format&fit=crop&q=85"},
{cat:"Fashion",title:"Aksesuar ilhamı",id:12,url:"https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=700&auto=format&fit=crop&q=85"},
{cat:"Nature",title:"Güneşli bahar çiçekleri",id:13,url:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=700&auto=format&fit=crop&q=85"},
{cat:"Nature",title:"Yeşil bir kaçış",id:14,url:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700&auto=format&fit=crop&q=85"},
{cat:"Nature",title:"Doğanın sakin tonları",id:15,url:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700&auto=format&fit=crop&q=85"},
{cat:"Nature",title:"Çiçek bahçesi",id:16,url:"https://images.unsplash.com/photo-1462275646964-a0e3386b89fa?w=700&auto=format&fit=crop&q=85"},
{cat:"Soft girl",title:"Soft pastel mood",id:17,url:"https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=700&auto=format&fit=crop&q=85"},
{cat:"Soft girl",title:"Pembe ve krem tonları",id:18,url:"https://images.unsplash.com/photo-1509631179647-0177331693ae?w=700&auto=format&fit=crop&q=85"},
{cat:"Soft girl",title:"Gün ışığında estetik",id:19,url:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=700&auto=format&fit=crop&q=85"},
{cat:"Soft girl",title:"Pastel ilham panosu",id:20,url:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=700&auto=format&fit=crop&q=85"},
{cat:"Room",title:"Rüya gibi oda",id:21,url:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=700&auto=format&fit=crop&q=85"},
{cat:"Room",title:"Cozy oda köşesi",id:22,url:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=700&auto=format&fit=crop&q=85"},
{cat:"Room",title:"Sade dekorasyon",id:23,url:"https://images.unsplash.com/photo-1615874694520-474822394e73?w=700&auto=format&fit=crop&q=85"},
{cat:"Room",title:"Pastel çalışma alanı",id:24,url:"https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=700&auto=format&fit=crop&q=85"}
];
let liked=new Set(),saved=new Set(),comments={},view="home",category="Tümü",activeComment=0;
const grid=document.getElementById("grid");
function render(){
 const query=document.getElementById("search").value.toLowerCase();
 let items=photos.filter(p=>(category==="Tümü"||p.cat===category)&&(`${p.title} ${p.cat}`).toLowerCase().includes(query));
 if(view==="saved")items=items.filter(p=>saved.has(p.id));
 if(view==="profile")items=items.filter(p=>liked.has(p.id)||saved.has(p.id));
 document.getElementById("heading").textContent=view==="saved"?"Kaydettiklerin ♡":view==="profile"?"Profilim ✿":view==="explore"?"Yeni ilhamlar keşfet ✧":"Bugün ne keşfediyoruz? ♡";
 document.getElementById("subtitle").textContent=view==="saved"?"Daha sonra bakmak istediklerin burada.":view==="profile"?"Beğendiğin ve kaydettiğin fotoğraflar.":"Sevdiğin renkler, küçük detaylar ve güzel fikirler burada.";
 grid.innerHTML="";
 if(!items.length){grid.innerHTML='<div class="empty">Burada henüz bir şey yok. ♡</div>';return}
 items.forEach(p=>{
  const card=document.createElement("article");card.className="card";
  card.innerHTML=`<img class="photo" src="${p.url}" alt="${p.title}" loading="lazy"><div class="cardbody"><p class="caption">${p.title}</p><div class="actions"><button class="action ${liked.has(p.id)?"liked":""}" data-like="${p.id}">${liked.has(p.id)?"♥":"♡"} Beğen</button><button class="action" data-comment="${p.id}">☏ Yorum</button><button class="action ${saved.has(p.id)?"saved":""}" data-save="${p.id}">${saved.has(p.id)?"✓":"▣"} Kaydet</button></div></div>`;
  grid.appendChild(card);
 });
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.addEventListener("click",e=>{
 const like=e.target.closest("[data-like]"),save=e.target.closest("[data-save]"),comment=e.target.closest("[data-comment]");
 if(like){const id=+like.dataset.like;liked.has(id)?liked.delete(id):liked.add(id);render()}
 if(save){const id=+save.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);render()}
 if(comment){activeComment=+comment.dataset.comment;document.getElementById("commentlist").innerHTML=(comments[activeComment]||[]).map(x=>`<p>${esc(x)}</p>`).join("")||"<p>İlk yorumu sen yaz! ♡</p>";document.getElementById("overlay").classList.add("show")}
});
document.getElementById("sendComment").onclick=()=>{const input=document.getElementById("commentInput"),value=input.value.trim();if(!value)return;(comments[activeComment]??=[]).push(value);document.getElementById("commentlist").innerHTML=comments[activeComment].map(x=>`<p>${esc(x)}</p>`).join("");input.value=""};
document.getElementById("closeModal").onclick=()=>document.getElementById("overlay").classList.remove("show");
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");category=b.dataset.cat;render()}));
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()}));
render();
</script>
</body>
</html>
